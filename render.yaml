services:
  - type: web
    name: creatoriq-java-backend
    runtime: docker
    plan: free
    rootDir: backend-java
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: commit
    healthCheckPath: /api/wallet/health
    envVars:
      - key: FRONTEND_ORIGINS
        sync: false

  - type: web
    name: creatoriq-analytics-python
    runtime: docker
    plan: free
    rootDir: analytics-python
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: commit
    healthCheckPath: /
    envVars:
      - key: FRONTEND_ORIGINS
        sync: false
      - key: CREATOR_METRICS_API_URL
        sync: false
      - key: DATABASE_URL
        sync: false

  - type: web
    name: creatoriq-react-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./frontend/dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
