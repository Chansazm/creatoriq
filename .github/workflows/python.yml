name: Python CI

on:
  push:
    branches: [main]
    paths:
      - "analytics-python/**"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "analytics-python/**"
      - ".github/workflows/python.yml"

permissions:
  contents: read

jobs:
  build:
    name: Validate FastAPI analytics service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics-python

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: analytics-python/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m compileall .

      - name: Import FastAPI app
        run: python -c "from main import app; print(app.title)"
        env:
          FRONTEND_ORIGINS: ${{ vars.FRONTEND_ORIGINS || 'http://localhost:3000,http://localhost:5173' }}
